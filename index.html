<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TJ News — Premium Mobile News App & Editorial CMS</title>
    <!-- Google Fonts: Plus Jakarta Sans & Newsreader for world-class modern editorial typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;0,6..72,700;0,6..72,800;1,6..72,500;1,6..72,600&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                red: '#C9252D',
                dark: '#0F1117',
                surface: '#F8F9FA'
              }
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'Inter', 'system-ui', 'sans-serif'],
              serif: ['Newsreader', 'Georgia', 'serif']
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-[#0B0D13] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

</html>
